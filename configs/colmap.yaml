# ===================================================
# COLMAP reconstruction: synced frames -> sparse model -> transforms.json
# Extract the frames first with run-images (configs/images.yaml).
#   pixi run run-colmap configs/colmap.yaml
#   pixi run run-colmap configs/colmap.yaml --steps colmap,colmap2nerf
# Relative paths are resolved from the repo root.
# ===================================================

# Steps to run (all true if this section is omitted). --steps on the CLI overrides it.
steps:
  import: true         # {images_dir}/syncd/rig1/cam{i} -> {output_dir}/images/rig1/camera{i+1}
  masks: true          # no-op unless use_masks (interactive SAM3 app)
  colmap: true         # -> {output_dir}/database.db, {output_dir}/sparse/0
  colmap2nerf: true    # -> {output_dir}/transforms.json

output_dir: colmap_output

# Output of run-images for the scene videos (or of run-refraction for underwater data).
# Cameras in the same order as in the calibration.
images_dir: images_scene

# Output of run-calibration (or of run-refraction for underwater data).
# Its calibration-camchain.yaml gives the rig intrinsics/extrinsics.
calibration_dir: calibration_output

# Use SAM3 masks from {output_dir}/masks in COLMAP and transforms.json.
use_masks: false

# Fixed mask for every frame (e.g. housing edges or rig parts in view), used by COLMAP and
# written as mask_path in transforms.json. White = keep, black = ignore; same size as the
# extracted frames. One path for all cameras, or a list with one per camera:
#   static_mask: files/mask.png
#   static_mask: [files/mask_cam0.png, files/mask_cam1.png]
static_mask: null

colmap:
  feature_type: SIFT              # SIFT | ALIKED_N16ROT
  matching_type: SIFT_BRUTEFORCE  # SIFT_BRUTEFORCE | SIFT_LIGHTGLUE | ALIKED_LIGHTGLUE
  matcher: sequential             # sequential | exhaustive
  # Any --Mapper.<key> option.
  mapper:
    ba_refine_focal_length: 0
    ba_refine_principal_point: 0
    ba_refine_extra_params: 0
    ba_refine_sensor_from_rig: 0  # keep the calibrated rig extrinsics fixed
    ba_use_gpu: 1
  # Extra raw arguments, e.g. ["--SequentialMatching.overlap", "20"]
  feature_extractor_args: []
  matcher_args: []
