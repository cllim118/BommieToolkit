# ===================================================
# Rig calibration (Kalibr): synced frames -> camchain + rig_config.json
# Extract the frames first with run-images (configs/images.yaml, calibration settings).
# For underwater data, calibrate in air; run-refraction (configs/refraction.yaml) builds the underwater calibration.
#   pixi run run-calibration configs/calibration.yaml
#   pixi run run-calibration configs/calibration.yaml --steps calibrate,rig_config
# Relative paths are resolved from the repo root.
# ===================================================

# Steps to run (all true if this section is omitted). --steps on the CLI overrides it.
steps:
  calibrate: true    # Kalibr -> {output_dir}/calibration-camchain.yaml
  rig_config: true   # -> {output_dir}/rig_config.json

output_dir: calibration_output

# Output of run-images for the calibration target videos. Kalibr runs on {images_dir}/syncd/cam{i}
# (cam0 is the reference camera).
images_dir: images_calibration

calibrate:
  target: files/april_10x6.yaml
  camera_model: pinhole-radtan   # Kalibr model, e.g. pinhole-radtan | pinhole-equi
  freq: 30
  verbose: false                 # true shows Kalibr plots (needs a display)
  create_bag: true               # false reuses an existing {output_dir}/calibration.bag
  manual_focal_length_init: true # Kalibr asks for a focal length per camera if init fails
  focal_length_guesses: []       # e.g. [1400, 1400] - answers the prompt automatically

